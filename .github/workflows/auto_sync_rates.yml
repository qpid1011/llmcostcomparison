name: Auto-Sync & Deploy Live LLM API Token Costs
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch live multi-provider LLM token costs & daily history snapshot
        run: python3 scripts/sync_llm_costs.py
      - name: Commit updated llm_costs.json and history archive
        run: |
          git config user.name "LLMCostComparison Bot"
          git config user.email "bot@llmcostcomparison.com"
          git add public/llm_costs.json public/history/
          if ! git diff --staged --quiet; then
            git commit -m "chore(costs): auto-sync live LLM API token pricing & daily history [skip ci]"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact (public/)
        uses: actions/upload-pages-artifact@v4
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
